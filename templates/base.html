<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RepairPass{% endblock %}</title>
  <style>
    :root { --brand:#0f766e; --brand-d:#115e59; --bg:#f4f6f8; --card:#fff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    header { background:var(--brand); color:#fff; }
    header .wrap { display:flex; align-items:center; gap:24px; padding:14px 20px; }
    header a { color:#fff; text-decoration:none; }
    header .logo { font-weight:700; font-size:1.25rem; }
    header nav a { margin-right:16px; opacity:.9; } header nav a:hover { opacity:1; text-decoration:underline; }
    .wrap { max-width:1000px; margin:0 auto; }
    main.wrap { padding:24px 20px 60px; }
    h1 { margin-top:0; } h2 { margin:0 0 12px; font-size:1.15rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
    table { width:100%; border-collapse:collapse; font-size:.93rem; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { background:#f8fafc; font-weight:600; color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.03em; }
    .table-scroll { overflow-x:auto; }
    input, select, textarea, button { font:inherit; }
    input, select, textarea { padding:8px 10px; border:1px solid #cbd5e1; border-radius:6px; width:100%; background:#fff; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
    button, .btn { background:var(--brand); color:#fff; border:0; padding:9px 16px; border-radius:6px; cursor:pointer; text-decoration:none; display:inline-block; }
    button:hover, .btn:hover { background:var(--brand-d); }
    .btn.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
    .search { display:flex; gap:10px; } .search input { flex:1; font-size:1.05rem; padding:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .grid3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
    @media (max-width:640px) { .grid2, .grid3 { grid-template-columns:1fr; } }
    .kv span { display:block; color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; }
    .kv strong { font-size:1.02rem; }
    .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.78rem; font-weight:600; }
    .b-active { background:#dcfce7; color:#166534; } .b-expired { background:#fee2e2; color:#991b1b; }
    .b-yes { background:#dcfce7; color:#166534; } .b-no { background:#fef3c7; color:#92400e; }
    .b-Ownership { background:#dbeafe; color:#1e40af; } .b-Repair { background:#ffedd5; color:#9a3412; } .b-Warranty { background:#ede9fe; color:#5b21b6; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:16px; }
    .flash.ok { background:#dcfce7; color:#166534; } .flash.error { background:#fee2e2; color:#991b1b; }
    details { border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-top:10px; background:#fafcfd; }
    summary { cursor:pointer; font-weight:600; color:var(--brand); }
    .muted { color:var(--muted); } .small { font-size:.85rem; }
    ul.parts { margin:4px 0 0; padding-left:18px; color:var(--muted); font-size:.85rem; }
    .chips a { display:inline-block; margin:0 8px 8px 0; padding:6px 12px; border:1px solid var(--line); border-radius:99px; background:#fff; color:var(--text); text-decoration:none; }
    .chips a.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="{{ url_for('index') }}">RepairPass</a>
    <nav>
      <a href="{{ url_for('index') }}">Search</a>
      <a href="{{ url_for('new_device') }}">Register device</a>
      <a href="{{ url_for('tables') }}">Tables</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
